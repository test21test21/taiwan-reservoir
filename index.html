<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Data 台灣數據：一眼看懂台灣的即時數字</title>
<meta name="description" content="把政府開放資料整理成一眼看懂的工具：台灣水庫即時蓄水率與水情燈號，更多台灣數據陸續推出。">
<link rel="canonical" href="https://taiwandata.info/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
:root {
  --bg: #f6f6f4; --surface: #ffffff; --fg: #1d2125; --muted: #676d73; --line: #e4e4e0;
  --water: #0a6cc2; --chip: #efefec;
  --shadow: 0 1px 2px rgba(12,30,46,.06), 0 4px 16px rgba(12,30,46,.05);
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "IBM Plex Sans Condensed", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1b1e21; --fg: #ececea; --muted: #9a9fa4; --line: #2c3035;
    --water: #4fb0f0; --chip: #24282c; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1b1e21; --fg: #ececea; --muted: #9a9fa4; --line: #2c3035;
  --water: #4fb0f0; --chip: #24282c; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(28px, 7vw, 40px); margin: 0; letter-spacing: .02em; }
.lead { color: var(--muted); margin: 6px 0 28px; }
.tools { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tool { display: block; height: 100%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; padding: 18px; color: var(--fg); text-decoration: none; }
a.tool:hover { border-color: var(--fg); }
.tool h2 { font-size: 18px; margin: 0 0 4px; }
.tool p { margin: 0; color: var(--muted); font-size: 14px; }
.tool .num { font-family: var(--f-num); font-size: 13px; color: var(--water); margin-top: 10px; }
.tool.soon { background: transparent; box-shadow: none; border-style: dashed; }
.tool.soon h2 { color: var(--muted); }
footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Taiwan Data 台灣數據</h1>
    <p class="lead">把政府開放資料整理成一眼看懂的工具。</p>
  </header>
  <ul class="tools">
    <li><a class="tool" href="reservoir/">
      <h2>台灣水庫水情</h2>
      <p>各區官方水情燈號、主要水庫即時蓄水率，一張地圖看懂。</p>
      <div class="num" id="res-updated">每小時更新</div>
    </a></li>
    <li><div class="tool soon"><h2>出生人口</h2><p>即將推出</p></div></li>
    <li><div class="tool soon"><h2>出入境人次</h2><p>即將推出</p></div></li>
  </ul>
  <footer>本站為個人經營，非政府網站；所有數據皆來自政府開放資料。</footer>
</div>
<script>
fetch("data/latest.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
  if (!d || !d.generated_at) return;
  var t = new Date(d.generated_at).toLocaleString("zh-TW", { timeZone: "Asia/Taipei", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  document.getElementById("res-updated").textContent = "資料更新 " + t;
}).catch(function () {});
</script>
</body>
</html>
