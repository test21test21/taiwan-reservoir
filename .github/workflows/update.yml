name: 更新水庫資料並部署

on:
  schedule:
    - cron: "17 * * * *"   # 每小時第 17 分（UTC）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 抓水利署資料
        if: github.event_name != 'push'
        run: python3 scripts/fetch_reservoirs.py

      - name: 抓戶政司出生、死亡資料（每天一次）
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ "$(date -u +%H)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/fetch_births.py
          fi

      - name: 抓民航局航班、觀光署旅遊資料（每天一次）
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ "$(date -u +%H)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/fetch_flights.py
            python3 scripts/fetch_travel.py
          fi

      - name: 存回 repo（保留每日快照）
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push

      - name: 準備網站檔案
        run: |
          mkdir _site
          cp index.html og.png favicon.ico favicon-32.png apple-touch-icon.png icon-192.png _site/
          cp -r reservoir _site/
          cp -r data _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          python3 scripts/build_pages.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
