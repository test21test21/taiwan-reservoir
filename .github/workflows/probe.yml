name: probe data sources (temporary)
on:
  push:
    branches: [claude/project-thread-g39uhz]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe; mkdir -p probe
          get(){ curl -sSL -m 120 -A "Mozilla/5.0 taiwandata.info" -o "probe/$1" "$2" -w "$1 %{http_code} %{size_download} %{content_type} %{url_effective}\n" >> probe/log.txt || echo "$1 FAIL" >> probe/log.txt; }
          for id in 41552 41540 41543 41546 41531 41528 40810; do get caa_$id.bin "https://www.caa.gov.tw/FileAtt.ashx?lang=1&id=$id"; done
          get admin_12124.html "https://admin.taiwan.net.tw/businessinfo/IssuePage?a=12124"
          get admin_14642.html "https://admin.taiwan.net.tw/businessinfo/FilePage?a=14642"
          get stat_main.js "https://stat.taiwan.net.tw/main-es2017.12a43d48256b7b0b46dd.js"
          cat probe/log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe && git commit -m "probe results 2" && git push
