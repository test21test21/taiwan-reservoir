name: probe data sources (temporary)
on:
  push:
    branches: [claude/project-thread-g39uhz]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          get(){ curl -sSL -m 120 -A "taiwandata.info" -o "probe/$1" "$2" -w "$1 %{http_code} %{size_download} %{content_type}\n" >> probe/log.txt || echo "$1 FAIL" >> probe/log.txt; }
          for id in 30680 30681 30673 30678 30683 30682 34966; do get caa_$id.csv "https://www.caa.gov.tw/FileAtt.ashx?lang=1&id=$id"; done
          for n in $(seq 1 30); do get tour_$n.csv "https://stat.taiwan.net.tw/data/opendata/$n"; done
          get outbound_idx.csv "https://media.taiwan.net.tw/od/01_PRD/國人出國旅遊重要指標統計表.csv"
          get stat_home.html "https://stat.taiwan.net.tw/"
          get stat_data.html "https://stat.taiwan.net.tw/data/opendata"
          cat probe/log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe results" && git push
