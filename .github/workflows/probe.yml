name: probe (temporary)
on:
  push:
    branches: [claude/project-thread-g39uhz]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-g39uhz }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          mkdir -p probe
          cd scripts && python3 - <<'PY'
          import csv, io, fetch_flights as F
          for kind in ("airports", "segments", "loadfactor"):
              meta = F.get(F.CAA.format(F.SOURCES[kind])).decode("utf-8-sig")
              rows = list(csv.reader(io.StringIO(meta)))
              open(f"../probe/{kind}-meta.txt", "w").write(meta)
              sheets = F.read_ods(F.get(rows[1][3]))
              with open(f"../probe/{kind}.txt", "w") as f:
                  for name, rs in sheets.items():
                      f.write(f"=== sheet {name}\n")
                      for r in rs[:80]:
                          f.write(" | ".join(F.clean(c) for c in r[:16]) + "\n")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe dump (temporary)" && git push
