name: probe data sources (temporary)
on:
  push:
    branches: [claude/project-thread-g39uhz]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe; mkdir -p probe/chunks
          curl -sSL -m 60 -o probe/runtime.js https://stat.taiwan.net.tw/runtime-es2017.acdc0a12732f5cddfce1.js
          python3 - <<'PY'
          import re,subprocess
          s=open('probe/runtime.js').read()
          m=re.search(r'\{(\d+:"[0-9a-f]+"(?:,\d+:"[0-9a-f]+")*)\}',s)
          pairs=re.findall(r'(\d+):"([0-9a-f]+)"',m.group(1)) if m else []
          print(len(pairs), s[:0])
          for k,h in pairs:
              for name in (f"{k}-es2017.{h}.js", f"{k}.{h}.js"):
                  r=subprocess.run(["curl","-sSL","-m","60","-o",f"probe/chunks/{name}","-w","%{http_code}",f"https://stat.taiwan.net.tw/{name}"],capture_output=True,text=True)
                  if r.stdout=="200": break
                  subprocess.run(["rm","-f",f"probe/chunks/{name}"])
          PY
          ls probe/chunks | head; du -sh probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe && git commit -m "probe results 3" && git push
