name: probe (temporary)
on:
  push:
    branches: [claude/project-thread-g39uhz]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-g39uhz }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python3 scripts/fetch_flights.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flights && git commit -m "補民航局 114 年每月資料" && git push
