name: probe data sources (temporary)
on:
  push:
    branches: [claude/project-thread-g39uhz]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          rm -rf probe data/flights data/travel
          python3 scripts/fetch_flights.py
          python3 scripts/fetch_travel.py
          git status --short | head
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe data && git commit -m "Fetch flight and travel data (test run)" && git push
