name: 試抓出生資料（暫時）

on:
  push:
    branches: [claude/project-thread-g45hxq]
    paths: [.github/workflows/probe-births.yml, scripts/fetch_births.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/fetch_births.py
      - name: 存回
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/births || true
          git commit -m "出生死亡資料（試抓）" && git push || true
