name: 試抓出生資料（暫時）

on:
  push:
    branches: [claude/project-thread-g45hxq]
    paths: [.github/workflows/probe-births.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓
        run: |
          mkdir -p probe
          curl -sS -m 60 -o probe/docs.html -w '%{http_code}\n' https://www.ris.gov.tw/rs-opendata/api/Main/docs/v1 || true
          curl -sS -m 60 -o probe/docs.json -w '%{http_code}\n' https://www.ris.gov.tw/rs-opendata/api/swagger/docs/v1 || true
          for m in 11407 11408; do
            curl -sS -m 120 -o probe/ODRP003-$m.json -w "$m %{http_code}\n" "https://www.ris.gov.tw/rs-opendata/api/v1/datastore/ODRP003/$m" || true
          done
          ls -la probe; head -c 600 probe/ODRP003-11408.json || true
      - name: 存回
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "試抓出生資料" && git push || true
