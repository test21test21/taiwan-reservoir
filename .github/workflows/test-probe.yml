name: test-probe
on:
  push:
    branches: [claude/project-thread-8qj6fe]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; cd probe
          g() { curl -sSL -m 300 -A "Mozilla/5.0" -o "$1" "$2" || echo "fail $1"; ls -la "$1"; }
          g tax6671.csv "https://web02.mof.gov.tw/njswww/webMain.aspx?sys=220&ym=6300&kind=21&type=5&funid=i0421&cycle=41&outmode=12&compmode=00&outkind=11&fldspc=0,44,45,9,&utf=1"
          g tax16910.csv "https://web02.mof.gov.tw/njswww/webMain.aspx?sys=220&ym=9000&kind=21&type=3&funid=i3451&cycle=4&outmode=12&compmode=00&outkind=3&fldlst=1111&codspc0=0,34,&utf=1"
          g tra_station.json "https://ods.railway.gov.tw/tra-ods-web/ods/download/dataResource/8ae4cabf6973990e0169947ed32454b9"
          g hsr.csv "https://www.rb.gov.tw/api/proxy/v4/file-service/Opendata%2F%E5%9B%9E%E5%82%B3%E9%99%84%E4%BB%B6-%E9%AB%98%E9%90%B5%E9%81%8B%E9%87%8F%E7%B5%B1%E8%A8%88%E8%A1%A8(%E6%9B%B4%E6%96%B0%E8%87%B311504)(CSV%E6%AA%94).csv"
          g trtc_od_list.csv "https://data.taipei/api/dataset/63f31c7e-7fc3-418b-bd82-b95158755b4d/resource/eb481f58-1238-4cff-8caa-fa7bb20cb4f4/download"
          curl -sSI "http://tcgmetro.blob.core.windows.net/stationod/%E8%87%BA%E5%8C%97%E6%8D%B7%E9%81%8B%E6%AF%8F%E6%97%A5%E5%88%86%E6%99%82%E5%90%84%E7%AB%99OD%E6%B5%81%E9%87%8F%E7%B5%B1%E8%A8%88%E8%B3%87%E6%96%99_202609.csv" | head -8
          curl -sSL -m 300 "http://tcgmetro.blob.core.windows.net/stationod/%E8%87%BA%E5%8C%97%E6%8D%B7%E9%81%8B%E6%AF%8F%E6%97%A5%E5%88%86%E6%99%82%E5%90%84%E7%AB%99OD%E6%B5%81%E9%87%8F%E7%B5%B1%E8%A8%88%E8%B3%87%E6%96%99_202609.csv" | head -c 3000000 > trtc_od_202609_head.csv
          ls -la; du -sh .
          for f in *; do [ $(stat -c %s "$f") -gt 40000000 ] && { head -c 2000000 "$f" > "$f.head"; rm "$f"; }; done
          cd ..; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "暫時：資料樣本" && git push
