name: test-probe
on:
  push:
    branches: [claude/project-thread-8qj6fe]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; cd probe
          npm pack taiwan-atlas && tar xzf taiwan-atlas-*.tgz && cp package/towns-10t.json . && ls -la package
          rm -rf package taiwan-atlas-*.tgz
          cd ..; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "暫時：鄉鎮界" && git push
