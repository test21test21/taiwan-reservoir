name: test-probe
on:
  push:
    branches: [claude/project-thread-8qj6fe]
    paths: [.github/workflows/test-probe.yml]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; cd probe
          curl -sSL -m 300 -A "Mozilla/5.0" -o tra_sta_info.json "https://ods.railway.gov.tw/tra-ods-web/ods/download/dataResource/0518b833e8964d53bfea3f7691aea0ee" || echo fail
          ls -la tra_sta_info.json; head -c 600 tra_sta_info.json; echo
          curl -sSL -m 600 -o /tmp/od.csv "http://tcgmetro.blob.core.windows.net/stationod/%E8%87%BA%E5%8C%97%E6%8D%B7%E9%81%8B%E6%AF%8F%E6%97%A5%E5%88%86%E6%99%82%E5%90%84%E7%AB%99OD%E6%B5%81%E9%87%8F%E7%B5%B1%E8%A8%88%E8%B3%87%E6%96%99_202609.csv"
          ls -la /tmp/od.csv
          python3 - <<'PY'
          import csv, collections, datetime, json
          hours = collections.Counter(); sta = collections.Counter(); od = collections.Counter(); days = collections.Counter(); dtype = collections.Counter()
          with open("/tmp/od.csv", encoding="utf-8-sig") as f:
              r = csv.reader(f); next(r)
              for row in r:
                  if len(row) < 5: continue
                  d, h, a, b, n = row[0], row[1], row[2], row[3], int(row[4] or 0)
                  wk = datetime.date.fromisoformat(d).weekday() >= 5
                  hours[(wk, int(h))] += n; sta[a] += n; days[d] += n; dtype[d] = wk
                  if a != b: od[(a, b)] += n
          out = {"hours": [[w, h, n] for (w, h), n in sorted(hours.items())], "days": sorted(days.items()),
                 "weekend": {d: w for d, w in dtype.items()},
                 "stations": sta.most_common(), "od_top": [[a, b, n] for (a, b), n in od.most_common(60)]}
          json.dump(out, open("trtc_202609_agg.json", "w"), ensure_ascii=False)
          print(len(sta), sum(days.values()))
          PY
          cd ..; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "暫時：台鐵車站、北捷 9 月彙整" && git push
