name: test-power
on:
  push:
    branches: [claude/project-thread-8qj6fe]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in 001 002 003 004 005 006 007 008 009 010 011 012; do for f in 001.json 001.csv 002.csv 002.json; do
            u=https://service.taipower.com.tw/data/opendata/apply/file/d006$d/$f
            c=$(curl -sS -m 30 -o /tmp/x -w "%{http_code}" "$u"); echo "=== $u HTTP $c $(wc -c </tmp/x)"; [ "$c" = 200 ] && head -c 700 /tmp/x && echo && tail -c 300 /tmp/x && echo
          done; done
