name: test-power
on:
  push:
    branches: [claude/project-thread-8qj6fe]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/fetch_power.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power
          git diff --cached --quiet || git commit -m "暫時：台電測試資料"
          git push
