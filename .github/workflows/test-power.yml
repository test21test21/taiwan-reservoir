name: test-power
on:
  push:
    branches: [claude/project-thread-8qj6fe]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in d006002/001.json d006002/001.csv d006001/001.json; do
            u=https://service.taipower.com.tw/data/opendata/apply/file/$f
            c=$(curl -sS -m 30 -o /tmp/x -w "%{http_code}" "$u"); echo "=== $u HTTP $c $(wc -c </tmp/x) $(wc -l </tmp/x)"; head -c 1200 /tmp/x; echo; echo ...; tail -c 1500 /tmp/x; echo
          done
